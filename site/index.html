<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mado · Your Nostr posts on your own website</title>
<meta name="description" content="Mado turns your Nostr articles and notes into a website you host yourself, on GitHub Pages or any static host. No server, no build step.">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/logo-180.png">
<style>
@font-face { font-family: "Fraunces"; font-weight: 500; font-display: swap; src: url(site/fonts/fraunces-500.woff2) format("woff2"); }
@font-face { font-family: "Fraunces"; font-weight: 700; font-display: swap; src: url(site/fonts/fraunces-700.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(site/fonts/inter-400.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url(site/fonts/inter-600.woff2) format("woff2"); }

:root {
	color-scheme: light dark;
	--bg: light-dark(#FAF8FD, #121214);
	--card: light-dark(#FFFFFF, #1B1B20);
	--fg: light-dark(#1D1D1F, #ECECEF);
	--muted: light-dark(#6E6E73, #9C9CA6);
	--line: light-dark(#E7E3EE, #2A2A31);
	--accent: light-dark(#7B3FE4, #B18CFF);
	--accent-ink: light-dark(#FFFFFF, #18122A);
	--accent-bg: light-dark(#F1EBFD, #241B38);
	--head: "Fraunces", Georgia, "Times New Roman", serif;
	--body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
	--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--body); -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
img { max-width: 100%; height: auto; display: block; }
.wrap { max-width: 70rem; margin: 0 auto; padding: 0 1.25rem; }
h1, h2, h3 { font-family: var(--head); font-weight: 600; line-height: 1.12; letter-spacing: -.01em; margin: 0; }
h2 { font-size: clamp(1.7rem, 3.6vw, 2.4rem); margin-bottom: .6rem; }
.lead { color: var(--muted); font-size: 1.08rem; max-width: 42rem; margin: 0 0 2.2rem; }
section { padding: 5rem 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
code { font: .86em var(--mono); background: var(--accent-bg); padding: .1rem .35rem; border-radius: 6px; overflow-wrap: anywhere; }

.top { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; }
.top .wrap { display: flex; align-items: center; gap: 1rem; height: 3.6rem; }
.top a { color: inherit; text-decoration: none; }
.brand { display: flex; align-items: center; gap: .55rem; font: 600 1.2rem var(--head); }
.brand img { width: 1.6rem; height: 1.6rem; }
.top nav { margin-left: auto; display: flex; align-items: center; gap: 1.1rem; font-size: .92rem; }
.navlink { color: var(--muted) !important; }
.navlink:hover { color: var(--fg) !important; }
.lang { display: flex; gap: .15rem; font-size: .8rem; }
.lang button, .theme { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; padding: .25rem .35rem; border-radius: 6px; }
.lang button[aria-pressed="true"] { color: var(--accent); font-weight: 600; background: var(--accent-bg); }
.theme { display: grid; place-items: center; }
.theme svg { width: 1.1rem; height: 1.1rem; }
.i-sun { display: none; }
:root[data-theme="dark"] .i-sun { display: block; } :root[data-theme="dark"] .i-moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .i-sun { display: block; } :root:not([data-theme="light"]) .i-moon { display: none; } }

.hero { padding: 5rem 0 3rem; text-align: center; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: -20% -10% auto; height: 34rem; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 18%, transparent), transparent); pointer-events: none; }
.hero .wrap { position: relative; }
.hero .logo { width: 5.5rem; height: 5.5rem; margin: 0 auto 1.4rem; }
.hero .jp { font: 500 .95rem var(--head); color: var(--accent); letter-spacing: .08em; }
.hero h1 { font-size: clamp(2.5rem, 7vw, 4.6rem); margin: .4rem auto 1.1rem; max-width: 15ch; }
.hero p { color: var(--muted); font-size: 1.15rem; max-width: 38rem; margin: 0 auto 2rem; }
.cta { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
.btn { display: inline-flex; align-items: center; gap: .5rem; padding: .8rem 1.3rem; border-radius: 999px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); color: var(--fg); background: var(--card); min-height: 48px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn svg { width: 1.1rem; height: 1.1rem; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.3rem; margin: 1.6rem 0 0; padding: 0; list-style: none; font-size: .9rem; color: var(--muted); }
.meta li::before { content: "◇ "; color: var(--accent); }

.window { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(40, 20, 80, .35); }
.window .bar { display: flex; align-items: center; gap: .4rem; padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
.window .bar i { width: .65rem; height: .65rem; border-radius: 50%; background: var(--line); }
.window .bar span { margin-left: .6rem; font: .78rem var(--mono); color: var(--muted); background: var(--bg); border-radius: 6px; padding: .15rem .6rem; flex: 1; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.showcase { margin-top: 3.5rem; }
.showcase .main { max-width: 60rem; margin: 0 auto; }

.looks { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); }
.looks figure { margin: 0; }
.looks figcaption { margin-top: .7rem; font-size: .92rem; color: var(--muted); }
.looks figcaption b { color: var(--fg); font-weight: 600; }

.features { display: grid; gap: 2rem 2.5rem; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }
.feature h3 { font-size: 1.25rem; margin-bottom: .4rem; display: flex; gap: .6rem; align-items: baseline; }
.feature h3::before { content: ""; flex: 0 0 .7rem; height: .7rem; border: 2px solid var(--accent); border-radius: 3px; transform: translateY(-.05rem); }
.feature p { margin: 0; color: var(--muted); font-size: .97rem; }

.steps { counter-reset: s; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); padding: 0; list-style: none; margin: 0 0 1.5rem; }
.steps li { counter-increment: s; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.3rem; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--accent-bg); color: var(--accent); font: 700 1rem var(--head); margin-bottom: .8rem; }
.steps b { display: block; margin-bottom: .3rem; }
.steps span { color: var(--muted); font-size: .95rem; }
.split { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); align-items: start; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.5rem; }
.box h3 { font-size: 1.2rem; margin-bottom: .6rem; }
.box p { margin: 0 0 1rem; color: var(--muted); font-size: .97rem; }

.trust { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); padding: 0; margin: 0; list-style: none; }
.trust li { border-top: 2px solid var(--accent); padding-top: 1rem; }
.trust b { display: block; font: 600 1.1rem var(--head); margin-bottom: .3rem; }
.trust span { color: var(--muted); font-size: .95rem; }

.faq details { border-bottom: 1px solid var(--line); padding: 1rem 0; }
.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
.faq summary::after { content: "+"; color: var(--accent); font-size: 1.3rem; line-height: 1; }
.faq details[open] summary::after { content: "−"; }
.faq details p { color: var(--muted); margin: .6rem 0 0; }

footer { border-top: 1px solid var(--line); padding: 2.5rem 0 3rem; color: var(--muted); font-size: .9rem; }
footer .wrap { display: grid; gap: 1rem; }
footer .links { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; }
footer .links a { color: var(--fg); text-decoration: none; }
footer .links a:hover { color: var(--accent); }
.donate { display: grid; gap: .6rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: .45rem; font: inherit; font-size: .88rem; font-weight: 600; text-decoration: none; color: var(--ink, var(--fg)); border: 1px solid; border-radius: 999px; padding: .3rem .85rem .3rem .35rem; cursor: pointer; transition: border-color .15s, background .15s; }
.chip svg { width: 1.35rem; height: 1.35rem; flex: none; }
.chip.btc { --c: #F7931A; } .chip.ln { --c: #7B3FE4; } .chip.nostr { --c: #8E30EB; }
.chip { border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 8%, transparent); }
.chip:hover { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); text-decoration: none; }
#copied { color: var(--accent); }

@media (max-width: 40rem) {
	body { font-size: 16px; }
	section { padding: 3.5rem 0; }
	.navlink { display: none; }
	.hero { padding-top: 3rem; }
}
</style>
</head>

<header class="top">
	<div class="wrap">
		<a class="brand" href="./"><img src="assets/img/logo.svg" alt="">Mado</a>
		<nav>
			<a class="navlink" href="#features" data-i="navFeatures"></a>
			<a class="navlink" href="#start" data-i="navStart"></a>
			<a class="navlink" href="https://oluengo.github.io/">oluengo</a>
			<div class="lang" role="group" aria-label="Language">
				<button data-lang="ca">CA</button><button data-lang="es">ES</button><button data-lang="en">EN</button>
			</div>
			<button class="theme" id="theme" type="button" data-i-aria="theme">
				<svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
				<svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			</button>
		</nav>
	</div>
</header>

<main>
	<div class="hero">
		<div class="wrap">
			<img class="logo" src="assets/img/logo.svg" alt="">

	<section id="looks" style="padding-top:2rem">

	<section id="start" style="padding-top:1rem">
		<div class="wrap">
			<h2 data-i="startTitle"></h2>
			<p class="lead" data-i="startLead"></p>

					<p data-i="adminText"></p>
					<a class="btn primary" href="admin/" data-i="adminBtn"></a>
				</div>
				<div class="box">
					<h3 data-i="liteTitle"></h3>
					<p data-i="liteText"></p>
					<a class="btn" href="https://github.com/oluengo/mado/blob/main/docs/es/alojamiento-propio.md" id="docs-link" data-i="docsBtn"></a>
				</div>
			</div>
		</div>
	</section>

	<section id="trust" style="padding-top:1rem">
		<div class="wrap">
			<h2 data-i="trustTitle"></h2>
			<p class="lead" data-i="trustLead"></p>
			<ul class="trust" id="trust-list"></ul>
		</div>
	</section>

	<section id="faq" style="padding-top:1rem">
		<div class="wrap faq">
			<h2 data-i="faqTitle"></h2>
			<div id="faq-list"></div>
		</div>
	</section>
</main>

function render(lang) {
	L = lang; const t = I[lang]; root.lang = lang;
	document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
	document.querySelectorAll("[data-i-aria]").forEach(el => { el.setAttribute("aria-label", t[el.dataset.iAria]); el.title = t[el.dataset.iAria]; });
	document.querySelectorAll("[data-i-alt]").forEach(el => { el.alt = t[el.dataset.iAlt]; });
	document.querySelectorAll("[data-list]").forEach(el => { el.innerHTML = t[el.dataset.list].map(x => "<li>" + esc(x) + "</li>").join(""); });
	document.getElementById("looks-list").innerHTML = t.looks.map(([f, n, d]) =>
		`<figure><div class="window"><div class="bar"><i></i><i></i><i></i></div><img src="site/img/${f}.webp" width="1280" height="820" loading="lazy" alt="${esc(n)}"></div><figcaption><b>${esc(n)}</b> · ${esc(d)}</figcaption></figure>`).join("") +
		`<p style="grid-column:1/-1;margin:0;color:var(--muted);font-size:.85rem">${esc(t.looksNote)}</p>`;
	document.getElementById("features-list").innerHTML = t.features.map(([h, p]) => `<div class="feature"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");
	document.getElementById("steps").innerHTML = t.steps.map(([b, s]) => `<li><b>${esc(b)}</b><span>${esc(s)}</span></li>`).join("");
	document.getElementById("trust-list").innerHTML = t.trust.map(([b, s]) => `<li><b>${esc(b)}</b><span>${esc(s)}</span></li>`).join("");
	document.getElementById("faq-list").innerHTML = t.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
	document.getElementById("docs-link").href = "https://github.com/oluengo/mado/blob/main/docs/" + t.docs;
		document.getElementById("readme").href = "https://github.com/oluengo/mado" + (lang === "en" ? "#english" : "");
	document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
	try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
	render(b.dataset.lang);
}));
try { const th = localStorage.getItem("theme"); if (th) root.dataset.theme = th; } catch (e) {}
document.getElementById("theme").addEventListener("click", () => {
	const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
	root.dataset.theme = cur === "dark" ? "light" : "dark";
	try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});
const copied = document.getElementById("copied"); let ct;
document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
	let ok = false;
	try { await navigator.clipboard.writeText(b.dataset.copy); ok = true; } catch (e) {}
	copied.textContent = ok ? b.textContent + " " + I[L].copied : b.dataset.copy;
	clearTimeout(ct); ct = setTimeout(() => { copied.textContent = ""; }, ok ? 1800 : 8000);
}));
render(pickLang());
</script>
</body>
</html>
